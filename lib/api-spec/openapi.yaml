        rank:
          type: integer
        active:
          type: boolean
        weight:
          type: number
      required: [sessionId, runAt, composite, rank, active, weight]

    EtfDetail:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        sector:
          type: string
        weight:
          type: number
          description: Current portfolio weight as decimal
        priorWeight:
          type: number
        change:
          type: number
          description: Change vs prior weight (decimal)
        active:
          type: boolean
        inclusionStatus:
          type: string
          enum: [active, excluded_threshold, excluded_rank, no_data, no_results]
          description: Why this ETF is or isn't in the portfolio
        rank:
          type: ["integer", "null"]
          description: Rank by composite score among all scored ETFs (1 = highest)
        totalScored:
          type: integer
          description: Total number of ETFs that received a composite score this run
        factorScores:
          oneOf:
            - $ref: "#/components/schemas/FactorScores"
