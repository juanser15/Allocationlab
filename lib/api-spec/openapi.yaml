openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Allocation Lab v2 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: universe
  - name: constraints
  - name: prices
  - name: run
  - name: results
  - name: reports
  - name: sessions
  - name: etf

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /universe:
    get:
      operationId: getUniverse
      tags: [universe]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Universe"
    put:
      operationId: updateUniverse
      tags: [universe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UniverseInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Universe"

  /constraints:
    get:
      operationId: getConstraints
      tags: [constraints]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Constraints"
    put:
      operationId: updateConstraints
      tags: [constraints]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConstraintsInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Constraints"

  /prices/status:
    get:
      operationId: getPricesStatus
      tags: [prices]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesStatus"

  /prices/live:
    post:
      operationId: fetchLivePrices
      tags: [prices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LivePricesFetchInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivePricesResult"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivePricesResult"

  /prices/upload:
    post:
      operationId: uploadPrices
      tags: [prices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricesUploadInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesStatus"

  /run:
    post:
      operationId: runPipeline
      tags: [run]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /results/latest:
    get:
      operationId: getLatestResults
      tags: [results]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

  /sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [sessions]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/generate:
    post:
      operationId: generateReport
      tags: [reports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResult"

  /reports/download/{token}:
    get:
      operationId: downloadReport
      tags: [reports]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /etf/{ticker}:
    get:
      operationId: getEtfDetail
      tags: [etf]
      summary: Get detailed ETF data including factor scores, price history, and allocation narrative
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EtfDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /decision-log:
    get:
      operationId: listDecisionLogs
      tags: [decision-log]
      summary: List all committee decision log entries, most recent first
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DecisionLog"

  /decision-log/{sessionId}:
    get:
      operationId: getOrCreateDecisionLog
      tags: [decision-log]
      summary: Get the decision log for a session, auto-generating a Draft entry from that session's results if none exists
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionLog"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /decision-log/{id}/status:
    patch:
      operationId: updateDecisionLogStatus
      tags: [decision-log]
      summary: Transition a decision log through Draft -> Under Review -> Approved (or back to Draft)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionLogStatusInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionLog"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /backtest:
    get:
      operationId: getBacktest
      tags: [backtest]
      summary: Run a forward-chained rebalancing backtest across historical price data using stored allocation sessions
      parameters:
        - name: benchmark
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: ["string", "null"]
      required: [error]

    EtfEntry:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        sector:
          type: string
        priorWeight:
          type: number
        enabled:
          type: boolean
      required: [ticker, name, sector, priorWeight, enabled]

    Universe:
      type: object
      properties:
        etfs:
          type: array
          items:
            $ref: "#/components/schemas/EtfEntry"
        cashPriorWeight:
          type: number
        updatedAt:
          type: string
      required: [etfs, cashPriorWeight, updatedAt]

    UniverseInput:
      type: object
      properties:
        etfs:
          type: array
          items:
            $ref: "#/components/schemas/EtfEntry"
        cashPriorWeight:
          type: number
      required: [etfs, cashPriorWeight]

    Constraints:
      type: object
      properties:
        cashMin:
          type: number
        cashMax:
          type: number
        maxEtfWeight:
          type: number
        minInclusionThreshold:
          type: number
        targetActiveEtfs:
          type: integer
        diversificationEnabled:
          type: boolean
        updatedAt:
          type: string
      required: [cashMin, cashMax, maxEtfWeight, minInclusionThreshold, targetActiveEtfs, diversificationEnabled, updatedAt]

    ConstraintsInput:
      type: object
      properties:
        cashMin:
          type: number
        cashMax:
          type: number
        maxEtfWeight:
          type: number
        minInclusionThreshold:
          type: number
        targetActiveEtfs:
          type: integer
        diversificationEnabled:
          type: boolean
      required: [cashMin, cashMax, maxEtfWeight, minInclusionThreshold, targetActiveEtfs, diversificationEnabled]

    PricesStatus:
      type: object
      properties:
        hasData:
          type: boolean
        tickers:
          type: array
          items:
            type: string
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        rowCount:
          type: integer
        missingTickers:
          type: array
          items:
            type: string
        message:
          type: string
      required: [hasData, tickers, startDate, endDate, rowCount, missingTickers, message]

    PricesUploadInput:
      type: object
      properties:
        csvContent:
          type: string
      required: [csvContent]

    LivePricesFetchInput:
      type: object
      properties:
        tickers:
          type: array
          items:
            type: string
        lookbackDays:
          type: integer
      required: []

    LivePricesTickerResult:
      type: object
      properties:
        ticker:
          type: string
        success:
          type: boolean
        rows:
          type: integer
        error:
          type: ["string", "null"]
      required: [ticker, success, rows, error]

    LivePricesResult:
      type: object
      properties:
        succeeded:
          type: array
          items:
            $ref: "#/components/schemas/LivePricesTickerResult"
        failed:
          type: array
          items:
            $ref: "#/components/schemas/LivePricesTickerResult"
        totalRows:
          type: integer
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        savedToDb:
          type: boolean
        message:
          type: string
        fetchedAt:
          type: string
      required: [succeeded, failed, totalRows, startDate, endDate, savedToDb, message, fetchedAt]

    RunInput:
      type: object
      properties:
        label:
          type: ["string", "null"]
        overrideDiversification:
          type: ["boolean", "null"]
      required: []

    FactorScores:
      type: object
      properties:
        mom20:
          type: number
        mom60:
          type: number
        mom120:
          type: number
        mom252:
          type: number
        trendQuality:
          type: number
        realizedVol60:
          type: number
        drawdown:
          type: number
        meanReversion:
          type: number
        composite:
          type: number
      required: [mom20, mom60, mom120, mom252, trendQuality, realizedVol60, drawdown, meanReversion, composite]

    EtfAllocation:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        sector:
          type: string
        weight:
          type: number
        priorWeight:
          type: number
        change:
          type: number
        factorScores:
          $ref: "#/components/schemas/FactorScores"
        active:
          type: boolean
      required: [ticker, name, sector, weight, priorWeight, change, factorScores, active]

    RegimeComponent:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        score:
          type: ["number", "null"]
        method:
          type: string
          enum: [computed, proxy, unavailable]
        description:
          type: string
      required: [key, label, score, method, description]

    RegimeScores:
      type: object
      properties:
        trend:
          type: number
        breadth:
          type: number
        volatility:
          type: number
        liquidity:
          type: number
        composite:
          type: number
        label:
          type: string
        components:
          type: array
          items:
            $ref: "#/components/schemas/RegimeComponent"
        confidence:
          type: number
        drivers:
          type: string
      required: [trend, breadth, volatility, liquidity, composite, label, components, confidence, drivers]

    WatchlistEntry:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        sector:
          type: string
        compositeScore:
          type: number
        blockingReason:
          type: string
          enum: [score_below_threshold, rank_cutoff, no_price_data]
        blockingFactor:
          type: string
        improvement:
          type: string
      required: [ticker, name, sector, compositeScore, blockingReason, blockingFactor, improvement]

    IcSummary:
      type: object
      properties:
        whatChanged:
          type: string
        why:
          type: string
        risks:
          type: string
        watchNext:
          type: string
      required: [whatChanged, why, risks, watchNext]

    IterationInfo:
      type: object
      properties:
        current:
          type: integer
        max:
          type: integer
        completed:
          type: array
          items:
            type: string
        next:
          type: array
          items:
            type: string
      required: [current, max, completed, next]

    RiskContributionEntry:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        weight:
          type: number
          description: Portfolio weight as decimal
        riskContributionPct:
          type: number
          description: Percentage of total portfolio variance attributed to this position
        marginalVolContribution:
          type: number
          description: Annualized vol contribution (marginal contribution to portfolio vol)
      required: [ticker, name, weight, riskContributionPct, marginalVolContribution]

    CorrelationCell:
      type: object
      properties:
        tickerA:
          type: string
        tickerB:
          type: string
        correlation:
          type: number
          description: Pearson correlation coefficient -1 to 1
      required: [tickerA, tickerB, correlation]

    TrackingErrorEntry:
      type: object
      properties:
        benchmarkTicker:
          type: string
        trackingError:
          type: number
          description: Annualized tracking error as decimal (e.g. 0.045 = 4.5%)
      required: [benchmarkTicker, trackingError]

    PortfolioDiagnostics:
      type: object
      properties:
        expectedVolatility:
          type: number
          description: Annualized portfolio volatility as decimal (e.g. 0.12 = 12%)
        hhi:
          type: number
          description: Herfindahl-Hirschman Index of portfolio weights 0-1 (1 = fully concentrated)
        effectiveNumberOfBets:
          type: number
          description: Effective number of independent bets (1/HHI). Higher = more diversified.
        diversificationScore:
          type: number
          description: Diversification score 0-100 based on average pairwise correlation
        riskContributions:
          type: array
          items:
            $ref: "#/components/schemas/RiskContributionEntry"
        correlationMatrix:
          type: array
          items:
            $ref: "#/components/schemas/CorrelationCell"
          description: Full N×N correlation matrix for active ETFs
        activeTickers:
          type: array
          items:
            type: string
        trackingErrors:
          type: array
          items:
            $ref: "#/components/schemas/TrackingErrorEntry"
        lookbackDays:
          type: integer
          description: Number of trading days used for covariance estimation
        insufficientDataReasons:
          type: array
          items:
            type: string
          description: Flags for any metrics that could not be fully computed
      required: [expectedVolatility, hhi, effectiveNumberOfBets, diversificationScore, riskContributions, correlationMatrix, activeTickers, trackingErrors, lookbackDays, insufficientDataReasons]

    RunResult:
      type: object
      properties:
        sessionId:
          type: integer
        runAt:
          type: string
        label:
          type: ["string", "null"]
        regime:
          $ref: "#/components/schemas/RegimeScores"
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/EtfAllocation"
        cashWeight:
          type: number
        cashPriorWeight:
          type: number
        cashChange:
          type: number
        activeEtfCount:
          type: integer
        investedSleeve:
          type: number
        priceDataEnd:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStep"
        watchlist:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistEntry"
        icSummary:
          $ref: "#/components/schemas/IcSummary"
        iterationInfo:
          $ref: "#/components/schemas/IterationInfo"
        diagnostics:
          $ref: "#/components/schemas/PortfolioDiagnostics"
      required: [sessionId, runAt, label, regime, allocations, cashWeight, cashPriorWeight, cashChange, activeEtfCount, investedSleeve, priceDataEnd, steps, watchlist, icSummary, iterationInfo, diagnostics]

    PipelineStep:
      type: object
      properties:
        step:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [pending, running, done, error]
        message:
          type: ["string", "null"]
      required: [step, label, status, message]

    Session:
      type: object
      properties:
        id:
          type: integer
        runAt:
          type: string
        label:
          type: ["string", "null"]
        activeEtfCount:
          type: integer
        cashWeight:
          type: number
        regimeLabel:
          type: string
        regimeComposite:
          type: number
      required: [id, runAt, label, activeEtfCount, cashWeight, regimeLabel, regimeComposite]

    SessionDetail:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/Session"
        result:
          $ref: "#/components/schemas/RunResult"
      required: [session, result]

    ReportInput:
      type: object
      properties:
        sessionId:
          type: ["integer", "null"]
        format:
          type: string
          enum: [pdf, png, csv]
        title:
          type: string
        subtitle:
          type: string
        reportDate:
          type: string
        portfolioName:
          type: string
        internalNote:
          type: string
      required: [format]

    ReportResult:
      type: object
      properties:
        format:
          type: string
        downloadToken:
          type: string
        filename:
          type: string
        generatedAt:
          type: string
      required: [format, downloadToken, filename, generatedAt]

    EtfPricePoint:
      type: object
      properties:
        date:
          type: string
        price:
          type: number
        returnPct:
          type: ["number", "null"]
          description: Daily return vs previous trading day (decimal)
      required: [date, price, returnPct]

    EtfScoreHistoryEntry:
      type: object
      properties:
        sessionId:
          type: integer
        runAt:
          type: string
        composite:
          type: number
        rank:
          type: integer
        active:
          type: boolean
        weight:
          type: number
      required: [sessionId, runAt, composite, rank, active, weight]

    EtfDetail:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        sector:
          type: string
        weight:
          type: number
          description: Current portfolio weight as decimal
        priorWeight:
          type: number
        change:
          type: number
          description: Change vs prior weight (decimal)
        active:
          type: boolean
        inclusionStatus:
          type: string
          enum: [active, excluded_threshold, excluded_rank, no_data, no_results]
          description: Why this ETF is or isn't in the portfolio
        rank:
          type: ["integer", "null"]
          description: Rank by composite score among all scored ETFs (1 = highest)
        totalScored:
          type: integer
          description: Total number of ETFs that received a composite score this run
        factorScores:
          oneOf:
            - $ref: "#/components/schemas/FactorScores"
            - type: "null"
        explanation:
          type: string
          description: Human-readable narrative of inclusion/exclusion decision
        priceHistory:
          type: array
          items:
            $ref: "#/components/schemas/EtfPricePoint"
          description: Last 90 trading days of price data
        scoreHistory:
          type: array
          items:
            $ref: "#/components/schemas/EtfScoreHistoryEntry"
          description: Composite score and rank across past pipeline runs
        lookbackRows:
          type: integer
          description: Number of price rows available for this ticker
        priceDataEnd:
          type: ["string", "null"]
        priceDataStart:
          type: ["string", "null"]
      required: [ticker, name, sector, weight, priorWeight, change, active, inclusionStatus, rank, totalScored, factorScores, explanation, priceHistory, scoreHistory, lookbackRows, priceDataEnd, priceDataStart]

    BacktestEquityPoint:
      type: object
      properties:
        date:
          type: string
        portfolioIndex:
          type: number
          description: Portfolio value indexed to 100 at backtest start
        benchmarkIndex:
          type: ["number", "null"]
          description: Benchmark value indexed to 100 at backtest start, null if no benchmark selected or unavailable
        drawdownPct:
          type: number
          description: Portfolio drawdown from running peak, as a decimal (negative or zero)
      required: [date, portfolioIndex, benchmarkIndex, drawdownPct]

    BacktestMonthlyReturn:
      type: object
      properties:
        month:
          type: string
          description: YYYY-MM
        portfolioReturn:
          type: number
        benchmarkReturn:
          type: ["number", "null"]
      required: [month, portfolioReturn, benchmarkReturn]

    BacktestPeriod:
      type: object
      properties:
        sessionId:
          type: integer
        label:
          type: ["string", "null"]
        startDate:
          type: string
        endDate:
          type: string
        tradingDays:
          type: integer
        regimeLabel:
          type: string
        cashWeight:
          type: number
        topHoldings:
          type: array
          items:
            type: string
          description: Top 1-3 held tickers by weight during this period
        periodReturn:
          type: ["number", "null"]
          description: Compounded portfolio return during this period, null if no overlapping price data
        contributionPct:
          type: ["number", "null"]
          description: Contribution to total cumulative return, in decimal (sums across periods to cumulativeReturn)
        turnover:
          type: ["number", "null"]
          description: One-way turnover fraction vs prior period's weights, null for the first period
      required: [sessionId, label, startDate, endDate, tradingDays, regimeLabel, cashWeight, topHoldings, periodReturn, contributionPct, turnover]

    BacktestResult:
      type: object
      properties:
        hasSufficientData:
          type: boolean
        insufficientReason:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        tradingDays:
          type: integer
        canAnnualize:
          type: boolean
          description: Whether the sample is long enough (>= 10 trading days) to trust annualized figures
        equityCurve:
          type: array
          items:
            $ref: "#/components/schemas/BacktestEquityPoint"
        cumulativeReturn:
          type: ["number", "null"]
        annualizedReturn:
          type: ["number", "null"]
        annualizedVolatility:
          type: ["number", "null"]
        sharpeRatio:
          type: ["number", "null"]
        maxDrawdown:
          type: ["number", "null"]
        avgTurnover:
          type: ["number", "null"]
        monthlyReturns:
          type: array
          items:
            $ref: "#/components/schemas/BacktestMonthlyReturn"
        periods:
          type: array
          items:
            $ref: "#/components/schemas/BacktestPeriod"
        narrative:
          type: ["string", "null"]
          description: Plain-language summary of which rebalances contributed most/least to performance
        benchmarkTicker:
          type: ["string", "null"]
