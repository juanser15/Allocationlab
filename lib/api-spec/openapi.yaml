        representation:
          type: string
          enum: [asset_returns, alpha_streams, signals]
        fingerprint: { type: string }
        engineVersion: { type: string }
        status:
          type: string
          enum: [SOLVED, INFEASIBLE, INVALID_INPUT, INVALID_RISK_MODEL, UNSUPPORTED, UNSUPPORTED_REPRESENTATION, UNSUPPORTED_CONSTRAINT, NUMERICAL_FAILURE, LIMIT_REACHED]
        request: { $ref: "#/components/schemas/AllocationRequest" }
        result: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
      required: [id, preparedInputId, representation, fingerprint, engineVersion, status, request, result, createdAt]

    AllocationReplay:
      type: object
      properties:
        allocationId: { type: integer }
        status: { type: string, enum: [pass, fail, engine_mismatch] }
        fingerprint: { type: string }
        differences:
          type: array
          items: { type: string }
        replayedResult: { type: object, additionalProperties: true }
      required: [allocationId, status, fingerprint, differences, replayedResult]
