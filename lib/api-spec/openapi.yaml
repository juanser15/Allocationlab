        scoreHistory:
          type: array
          items:
            $ref: "#/components/schemas/EtfScoreHistoryEntry"
          description: Composite score and rank across past pipeline runs
        lookbackRows:
          type: integer
          description: Number of price rows available for this ticker
        priceDataEnd:
          type: ["string", "null"]
        priceDataStart:
          type: ["string", "null"]
      required: [ticker, name, sector, weight, priorWeight, change, active, inclusionStatus, rank, totalScored, factorScores, explanation, priceHistory, scoreHistory, lookbackRows, priceDataEnd, priceDataStart]

