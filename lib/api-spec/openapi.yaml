openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Allocation Lab v2 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: universe
  - name: constraints
  - name: prices
  - name: run
  - name: results
  - name: reports
  - name: sessions
  - name: etf
  - name: risk-model
  - name: scenario-stress
  - name: trade-implementation
  - name: attribution
  - name: signals
  - name: factors
  - name: prepared-inputs
  - name: allocations
  - name: alpha-diagnostics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /universe:
    get:
      operationId: getUniverse
      tags: [universe]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Universe"
    put:
      operationId: updateUniverse
      tags: [universe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UniverseInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Universe"

  /constraints:
    get:
      operationId: getConstraints
      tags: [constraints]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Constraints"
    put:
      operationId: updateConstraints
      tags: [constraints]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConstraintsInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Constraints"

  /prices/status:
    get:
      operationId: getPricesStatus
      tags: [prices]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesStatus"

  /prices/live:
    post:
      operationId: fetchLivePrices
      tags: [prices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LivePricesFetchInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivePricesResult"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivePricesResult"

  /prices/upload:
    post:
      operationId: uploadPrices
      tags: [prices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricesUploadInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesStatus"

  /run:
    post:
      operationId: runPipeline
      tags: [run]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Portfolio constraints are infeasible for the eligible universe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /results/latest:
    get:
      operationId: getLatestResults
      tags: [results]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

  /sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [sessions]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/reproduce:
    get:
      operationId: reproduceSession
      tags: [sessions]
      summary: Replay frozen optimization inputs using the recorded engine version
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reproduction status (including legacy or engine-version mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunReproduction"

  /risk-model:
    get:
      operationId: getRiskModel
      tags: [risk-model]
      summary: Risk Model Pro — covariance-based risk analytics for the latest allocation
      parameters:
        - name: covarianceModel
          in: query
          required: false
          schema:
            type: string
            enum: [sample, ewma, shrinkage]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskModelResult"
        "400":
          description: No allocation run available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scenario-stress/meta:
    get:
      operationId: getScenarioStressMeta
      tags: [scenario-stress]
      summary: Macro proxy availability, predefined stress scenario coverage, and saved portfolio versions
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioStressMeta"

  /scenario-stress/run:
    post:
      operationId: runScenarioStress
      tags: [scenario-stress]
      summary: Run a scenario analysis (user-defined shocks) or a stress test (predefined historical window)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioStressRunInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioStressResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trade-implementation/meta:
    get:
      operationId: getTradeImplementationMeta
      tags: [trade-implementation]
      summary: Cheap readiness check for trade implementation (no AUM required) — used by Dashboard and Investment Committee
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeImplementationMeta"

  /trade-implementation:
    get:
      operationId: getTradeImplementation
      tags: [trade-implementation]
      summary: Convert the latest allocation's current -> target weights into an actionable, cost-aware trade list for a given AUM
      parameters:
        - name: aumUsd
          in: query
          required: true
          schema:
            type: number
        - name: executionTiming
          in: query
          required: false
          schema:
            type: string
            enum: [next_close, next_open]
        - name: transactionCostBps
          in: query
          required: false
          schema:
            type: number
        - name: slippageBps
          in: query
          required: false
          schema:
            type: number
        - name: cashYieldAnnualPct
          in: query
          required: false
          schema:
            type: number
        - name: rebalanceFrequency
          in: query
          required: false
          schema:
            type: string
            enum: [monthly, quarterly]
        - name: minTradeSizeUsd
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeImplementationResult"
        "400":
          description: Bad request — missing allocation, previous weights, price data, or AUM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /attribution/meta:
    get:
      operationId: getAttributionMeta
      tags: [attribution]
      summary: Cheap readiness check for the attribution engine (session, realized history, prior weights, benchmark availability)
      parameters:
        - name: versionId
          in: query
          required: false
          schema:
            type: integer
        - name: benchmarkTicker
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionMeta"

  /attribution:
    get:
      operationId: getAttribution
      tags: [attribution]
      summary: Decompose realized performance of a saved rebalance version vs benchmark, by ETF, by decision, by factor, by regime, and net of costs
      parameters:
        - name: versionId
          in: query
          required: false
          schema:
            type: integer
        - name: benchmarkTicker
          in: query
          required: false
          schema:
            type: string
        - name: transactionCostBps
          in: query
          required: false
          schema:
            type: number
        - name: slippageBps
          in: query
          required: false
          schema:
            type: number
        - name: cashYieldAnnualPct
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionResult"

  /governance/dashboard:
    get:
      operationId: getGovernanceDashboard
      tags: [governance]
      summary: Governance dashboard — version status, pending approvals, stale data warnings, missing validation, locked reports, recent audit events
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceDashboard"

  /governance/versions:
    get:
      operationId: listGovernanceVersions
      tags: [governance]
      summary: List all saved portfolio versions with their governance record (or lack thereof)
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GovernanceVersionSummary"

  /governance/versions/{sessionId}:
    get:
      operationId: getGovernanceVersion
      tags: [governance]
      summary: Full governance record and change history for a saved portfolio version
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceVersionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /governance/versions/{sessionId}/snapshot:
    post:
      operationId: createGovernanceSnapshot
      tags: [governance]
      summary: Record (or refresh) the immutable governance snapshot for a saved portfolio version
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceSnapshotInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceVersionDetail"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /governance/versions/{sessionId}/lock:
    post:
      operationId: lockGovernanceVersion
      tags: [governance]
      summary: Archive-lock an approved version so it cannot be modified without a new version
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceActorInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceVersionDetail"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /governance/versions/{sessionId}/unlock:
    post:
      operationId: unlockGovernanceVersion
      tags: [governance]
      summary: Remove the archive lock on a version (audited)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceActorInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceVersionDetail"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /governance/versions/{sessionId}/rerun-check:
    post:
      operationId: rerunGovernanceConsistencyCheck
      tags: [governance]
      summary: Rerun the pipeline against this version's stored governance inputs and compare the reproducibility hash
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceRerunCheckResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /governance/audit-log:
    get:
      operationId: getGovernanceAuditLog
      tags: [governance]
      summary: Full governance audit trail, optionally filtered by session
      parameters:
        - name: sessionId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GovernanceAuditLogEntry"

  /reports/generate:
    post:
      operationId: generateReport
      tags: [reports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResult"

  /reports/download/{token}:
    get:
      operationId: downloadReport
      tags: [reports]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /etf/{ticker}:
    get:
      operationId: getEtfDetail
      tags: [etf]
      summary: Get detailed ETF data including factor scores, price history, and allocation narrative
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EtfDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /decision-log:
    get:
      operationId: listDecisionLogs
      tags: [decision-log]
      summary: List all committee decision log entries, most recent first
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DecisionLog"

  /decision-log/{sessionId}:
    get:
      operationId: getOrCreateDecisionLog
      tags: [decision-log]
      summary: Get the decision log for a session, auto-generating a Draft entry from that session's results if none exists
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionLog"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /decision-log/{id}/status:
    patch:
      operationId: updateDecisionLogStatus
      tags: [decision-log]
      summary: Transition a decision log through Draft -> Under Review -> Approved (or back to Draft)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionLogStatusInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionLog"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /archive:
    get:
      operationId: listArchive
      tags: [archive]
      summary: List all completed rebalances as dated portfolio versions, with filters
      parameters:
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
        - name: toDate
          in: query
          required: false
          schema:
            type: string
        - name: regime
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, under_review, approved, none]
        - name: portfolioName
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveListResponse"

  /archive/{sessionId}:
    get:
      operationId: getArchiveEntry
      tags: [archive]
      summary: Get the full archived detail for one saved rebalance
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /archive/compare:
    get:
      operationId: compareArchive
      tags: [archive]
      summary: Compare two archived rebalances side by side, including turnover and realized return between them
      parameters:
        - name: a
          in: query
          required: true
          schema:
            type: integer
        - name: b
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveCompareResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /backtest:
    get:
      operationId: getBacktest
      tags: [backtest]
      summary: Run a bias-resistant, point-in-time walk-forward backtest with configurable execution/cost assumptions and an integrity audit
      parameters:
        - name: sessionId
          in: query
          required: false
          description: Saved optimization run to validate. Defaults to the latest saved run; never uses current working inputs.
          schema: { type: integer }
        - name: benchmark
          in: query
          required: false
          schema:
            type: string
        - name: rebalanceFrequency
          in: query
          required: false
          schema:
            type: string
            enum: [monthly, quarterly]
        - name: executionTiming
          in: query
          required: false
          schema:
            type: string
            enum: [same_close, next_close, next_open]
        - name: transactionCostBps
          in: query
          required: false
          schema:
            type: number
        - name: slippageBps
          in: query
          required: false
          schema:
            type: number
        - name: maxTurnoverPerRebalance
          in: query
          required: false
          schema:
            type: number
        - name: cashYieldAnnual
          in: query
          required: false
          schema:
            type: number
        - name: warmupDays
          in: query
          required: false
          schema:
            type: number
        - name: startDate
          in: query
          required: false
          description: Optional ISO date (YYYY-MM-DD). Restricts simulated rebalances to this date or later; signal computation still uses earlier history for lookback warmup.
          schema:
            type: string
        - name: endDate
          in: query
          required: false
          description: Optional ISO date (YYYY-MM-DD). Truncates uploaded price history so the backtest simulates "as of" this date.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"
        "422":
          description: Portfolio constraints are infeasible for a rebalance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /validation-runs:
    post:
      operationId: createValidationRun
      tags: [backtest]
      summary: Execute and persist a legacy Strategy Snapshot validation or a frozen B3 policy validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationRunInput"
      responses:
        "201":
          description: Saved validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationRunResponse"
        "422":
          description: Portfolio constraints are infeasible for a rebalance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listValidationRuns
      tags: [backtest]
      parameters:
        - name: sessionId
          in: query
          required: false
          description: Filter legacy validations by saved Strategy Snapshot; mutually exclusive with allocationId and source.
          schema: { type: integer }
        - name: allocationId
          in: query
          required: false
          description: Filter B3 validations for a frozen B2 allocation policy.
          schema: { type: integer }
        - name: source
          in: query
          required: false
          description: Use b3 to list all B3 validations for side-by-side comparison.
          schema: { type: string, enum: [b3] }
      responses:
        "200":
          description: Validation Runs for the selected Strategy Snapshot, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValidationRunListItem"

  /validation-runs/{validationRunId}:
    get:
      operationId: getValidationRun
      tags: [backtest]
      parameters:
        - name: validationRunId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Exact persisted result (never recalculated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationRunResponse"
        "404":
          description: Validation Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /validation-runs/{validationRunId}/replay:
    post:
      operationId: replayValidationRun
      tags: [backtest]
      summary: Replay a B3 validation using its frozen policy and validation snapshots
      parameters:
        - name: validationRunId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Replay comparison; numeric outputs are compared with 1e-8 tolerance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationRunReplay"
        "404":
          description: Validation Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alpha-contribution-experiments:
    post:
      operationId: createAlphaContributionExperiment
      tags: [backtest]
      summary: Reoptimize and persist a frozen C1 alpha contribution comparison
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/C1ExperimentInput" }
      responses:
        "201":
          description: Saved experiment with immutable child B3 validation results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/C1Experiment" }
        "400":
          description: Invalid experiment request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Selected allocation or prepared input was not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Frozen inputs failed fingerprint or policy consistency checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Experiment planning rejected a policy cap, holdout boundary, or invalid exclusion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      operationId: listAlphaContributionExperiments
      tags: [backtest]
      summary: List persisted C1 alpha contribution experiments without rerunning them
      responses:
        "200":
          description: Saved experiments, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/C1Experiment" }

  /alpha-contribution-experiments/{experimentId}:
    get:
      operationId: getAlphaContributionExperiment
      tags: [backtest]
      parameters:
        - name: experimentId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Exact persisted C1 manifest, child results and summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/C1Experiment" }
        "400":
          description: Invalid experiment ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Experiment not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /alpha-contribution-experiments/{experimentId}/replay:
    post:
      operationId: replayAlphaContributionExperiment
      tags: [backtest]
      summary: Verify an experiment manifest and replay its immutable child B3 validations
      parameters:
        - name: experimentId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Manifest integrity and child B3 replay comparisons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/C1ExperimentReplay" }
        "400":
          description: Invalid experiment ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Experiment not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /alpha-diagnostics:
    post:
      operationId: createAlphaDiagnosticExperiment
      tags: [alpha-diagnostics]
      summary: Compute and immutably persist C2 alpha diagnostics from frozen B1/B2 sources
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/C2ExperimentInput" }
      responses:
        "201":
          description: Persisted C2 manifest and result snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/C2Experiment" }
        "400":
          description: Invalid C2 request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Frozen allocation or preparation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Frozen source identity, hash, or C1 comparison mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Requested C2 analysis is not supported by frozen sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      operationId: listAlphaDiagnosticExperiments
      tags: [alpha-diagnostics]
      summary: List immutable C2 experiments without recomputing results
      responses:
        "200":
          description: Saved C2 experiments, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/C2Experiment" }

  /alpha-diagnostics/{experimentId}:
    get:
      operationId: getAlphaDiagnosticExperiment
      tags: [alpha-diagnostics]
      parameters:
        - name: experimentId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Exact persisted C2 manifest and result snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/C2Experiment" }
        "400":
          description: Invalid experiment ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Experiment not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /alpha-diagnostics/{experimentId}/replay:
    post:
      operationId: replayAlphaDiagnosticExperiment
      tags: [alpha-diagnostics]
      summary: Recompute diagnostics exclusively from the experiment's frozen source manifest
      parameters:
        - name: experimentId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Frozen-source integrity and numerical replay comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/C2ExperimentReplay" }
        "400":
          description: Invalid experiment ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Experiment not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /committee:
    get:
      operationId: getCommittee
      tags: [committee]
      summary: Deterministic AI Investment Committee synthesis grounded strictly in already-computed session data
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitteeResult"
        "404":
          description: No allocation run available yet
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required: [error]

  /signals/catalog:
    get:
      operationId: getSignalsCatalog
      tags: [signals]
      summary: Catalog of persisted signals and request-time-only analytical capabilities
      security:
        - signalExportBearer: []
      responses:
        "200":
          description: Signal catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalsCatalogResponse"
        "401":
          description: Missing or invalid server-to-server token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalExportError"
        "403":
          description: Browser-direct access is forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalExportError"
        "503":
          description: Integration is not configured or its persisted sources are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalExportError"

  /signals/latest:
    get:
      operationId: getSignalsLatest
      tags: [signals]
      summary: Latest persisted signal observations
      security:
        - signalExportBearer: []
      parameters:
        - $ref: "#/components/parameters/SignalIdFilter"
        - $ref: "#/components/parameters/AssetFilter"
        - $ref: "#/components/parameters/SignalDateFrom"
        - $ref: "#/components/parameters/SignalDateTo"
        - $ref: "#/components/parameters/SignalLimit"
      responses:
        "200":
          description: Latest observations matching the filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalsResponse"
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalExportError"
        "401":
          description: Missing or invalid server-to-server token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalExportError"
        "403":
          description: Browser-direct access is forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalExportError"
        "503":
          description: Integration is not configured or its persisted sources are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalExportError"

  /signals/history:
    get:
      operationId: getSignalsHistory
      tags: [signals]
      summary: Persisted signal history without interpolation or request-time calculations
      security:
        - signalExportBearer: []
      parameters:
        - $ref: "#/components/parameters/SignalIdFilter"
        - $ref: "#/components/parameters/AssetFilter"
        - $ref: "#/components/parameters/SignalDateFrom"
        - $ref: "#/components/parameters/SignalDateTo"
        - $ref: "#/components/parameters/SignalLimit"
      responses:
        "200":
          description: Historical observations matching the filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalsResponse"
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalExportError"

  /factors/library:
    get:
      operationId: getFactorLibrary
      tags: [factors]
      summary: Get the current versioned factor library
      responses:
        "200":
          description: Current factor library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactorLibrary"
    put:
      operationId: updateFactorLibrary
      tags: [factors]
      summary: Save a new factor-library version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactorLibraryInput"
      responses:
        "200":
          description: Saved factor library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactorLibrary"
        "400":
          description: Invalid factor configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /factors/library/restore/{version}:
    post:
      operationId: restoreFactorLibrary
      tags: [factors]
      summary: Restore a historical factor set as a new version
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restored factor library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactorLibrary"
        "404":
          description: Factor-set version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid server-to-server token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalExportError"
        "403":
          description: Browser-direct access is forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalExportError"
        "503":
          description: Integration is not configured or its persisted sources are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalExportError"

  /prepared-inputs:
    get:
      operationId: listPreparedInputs
      tags: [prepared-inputs]
      responses:
        "200":
          description: Immutable prepared input versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PreparedInput" }
    post:
      operationId: prepareInputs
      tags: [prepared-inputs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreparedInputRequest" }
      responses:
        "201":
          description: Prepared and persisted immutable inputs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreparedInput" }
        "400": { description: Invalid request }
        "422": { description: Inputs cannot be prepared from available data }
  /prepared-inputs/{preparedInputId}:
    get:
      operationId: getPreparedInput
      tags: [prepared-inputs]
      parameters:
        - name: preparedInputId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Frozen prepared input version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreparedInput" }
        "404": { description: Not found }
  /prepared-inputs/{preparedInputId}/compose:
    post:
      operationId: composePreparedInput
      tags: [prepared-inputs]
      parameters:
        - name: preparedInputId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreparedCompositionInput" }
      responses:
        "200":
          description: User-specified alpha exposure mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreparedComposition" }
        "400": { description: Invalid weights or unsupported signed/leverage request }
        "404": { description: Not found }
  /prepared-inputs/{preparedInputId}/replay:
    post:
      operationId: replayPreparedInput
      tags: [prepared-inputs]
      parameters:
        - name: preparedInputId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Deterministic replay result from frozen inputs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreparedReplay" }
        "404": { description: Not found }

  /allocations:
    get:
      operationId: listAllocations
      tags: [allocations]
      summary: List immutable B2 allocation versions
      responses:
        "200":
          description: Saved allocation versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AllocationVersion" }
    post:
      operationId: createAllocation
      tags: [allocations]
      summary: Solve and persist an immutable B2 allocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllocationRequest" }
      responses:
        "201":
          description: Allocation result persisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllocationVersion" }
        "400":
          description: Invalid request or unsupported representation/constraint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Prepared input version not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Selected B1 candidates are not ready or do not belong to the preparation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Allocation is infeasible or could not be solved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /allocations/{allocationId}:
    get:
      operationId: getAllocation
      tags: [allocations]
      parameters:
        - name: allocationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Frozen allocation version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllocationVersion" }
        "400":
          description: Invalid allocation ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /allocations/{allocationId}/replay:
    post:
      operationId: replayAllocation
      tags: [allocations]
      summary: Replay the solver against the allocation's frozen B1 snapshot and request
      parameters:
        - name: allocationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Deterministic replay and saved-result integrity comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllocationReplay" }
        "400":
          description: Invalid allocation ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    signalExportBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
      description: Server-to-server token held by the dashboard backend, never by browser code.
  parameters:
    SignalIdFilter:
      name: signalId
      in: query
      required: false
      description: Exact signal identifier from the catalog.
      schema:
        type: string
        minLength: 1
        maxLength: 160
    AssetFilter:
      name: asset
      in: query
      required: false
      description: Exact asset/ticker filter. Input is normalized to uppercase.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    SignalDateFrom:
      name: dateFrom
      in: query
      required: false
      description: Inclusive ISO date or timestamp.
      schema:
        type: string
        minLength: 10
        maxLength: 40
    SignalDateTo:
      name: dateTo
      in: query
      required: false
      description: Inclusive ISO date or timestamp.
      schema:
        type: string
        minLength: 10
        maxLength: 40
    SignalLimit:
      name: limit
      in: query
      required: false
      description: Strict maximum number of observations returned.
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 1000
  schemas:
    FactorRegimeWeights:
      type: object
      properties:
        riskOn:
          type: ["number", "null"]
        neutral:
          type: ["number", "null"]
        riskOff:
          type: ["number", "null"]
      required: [riskOn, neutral, riskOff]

    FactorDefinition:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        family:
          type: string
        enabled:
          type: boolean
        status:
          type: string
          enum: [active, candidate, disabled]
        inputSeries:
          type: string
        calculationType:
          type: string
          enum: [momentum, trend_quality, volatility, drawdown, mean_reversion, relative_strength, diversification_benefit, return_over_volatility, ma_distance, downside_beta, residual_momentum, correlation_stability, drawdown_recovery, unsupported]
        formula:
          type: string
        direction:
          type: string
          enum: [higher_is_better, lower_is_better]
        lookback:
          type: integer
          minimum: 2
          maximum: 1260
        lag:
          type: integer
          minimum: 0
          maximum: 252
        normalization:
          type: string
          enum: [percentile_rank, z_score, robust_z_score]
        winsorizationLower:
          type: number
          minimum: 0
          maximum: 0.49
        winsorizationUpper:
          type: number
          minimum: 0.51
          maximum: 1
        missingDataTreatment:
          type: string
          enum: [exclude, cross_sectional_median]
        baseWeight:
          type: number
          minimum: 0
        regimeWeights:
          $ref: "#/components/schemas/FactorRegimeWeights"
        activeRegimes:
          type: array
          items:
            type: string
            enum: [risk_on, neutral, risk_off]
        dataSource:
          type: string
        benchmarkTicker:
          type: ["string", "null"]
        currentCoverage:
          type: number
          minimum: 0
          maximum: 1
        availabilityReason:
          type: ["string", "null"]
        version:
          type: string
      required: [id, name, description, family, enabled, status, inputSeries, calculationType, formula, direction, lookback, lag, normalization, winsorizationLower, winsorizationUpper, missingDataTreatment, baseWeight, regimeWeights, activeRegimes, dataSource, benchmarkTicker, currentCoverage, availabilityReason, version]

    FactorDefinitionInput:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        family:
          type: string
          minLength: 1
        enabled:
          type: boolean
        status:
          type: string
          enum: [active, candidate, disabled]
        inputSeries:
          type: string
          minLength: 1
        calculationType:
          type: string
          enum: [momentum, trend_quality, volatility, drawdown, mean_reversion, relative_strength, diversification_benefit, return_over_volatility, ma_distance, downside_beta, residual_momentum, correlation_stability, drawdown_recovery, unsupported]
        formula:
          type: string
          minLength: 1
        direction:
          type: string
          enum: [higher_is_better, lower_is_better]
        lookback:
          type: integer
          minimum: 2
          maximum: 1260
        lag:
          type: integer
          minimum: 0
          maximum: 252
        normalization:
          type: string
          enum: [percentile_rank, z_score, robust_z_score]
        winsorizationLower:
          type: number
          minimum: 0
          maximum: 0.49
        winsorizationUpper:
          type: number
          minimum: 0.51
          maximum: 1
        missingDataTreatment:
          type: string
          enum: [exclude, cross_sectional_median]
        baseWeight:
          type: number
          minimum: 0
        regimeWeights:
          $ref: "#/components/schemas/FactorRegimeWeights"
        activeRegimes:
          type: array
          items:
            type: string
            enum: [risk_on, neutral, risk_off]
        dataSource:
          type: string
        benchmarkTicker:
          type: ["string", "null"]
      required: [id, name, description, family, enabled, status, inputSeries, calculationType, formula, direction, lookback, lag, normalization, winsorizationLower, winsorizationUpper, missingDataTreatment, baseWeight, regimeWeights, activeRegimes, dataSource, benchmarkTicker]

    FactorLibraryInput:
      type: object
      properties:
        factors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FactorDefinitionInput"
      required: [factors]

    FactorSetHistoryEntry:
      type: object
      properties:
        version:
          type: string
        createdAt:
          type: string
        activeFactorCount:
          type: integer
        factorCount:
          type: integer
      required: [version, createdAt, activeFactorCount, factorCount]

    FactorLibrary:
      type: object
      properties:
        version:
          type: string
        updatedAt:
          type: string
        factors:
          type: array
          items:
            $ref: "#/components/schemas/FactorDefinition"
        history:
          type: array
          items:
            $ref: "#/components/schemas/FactorSetHistoryEntry"
      required: [version, updatedAt, factors, history]

    FactorContribution:
      type: object
      properties:
        factorId:
          type: string
        factorName:
          type: string
        rawValue:
          type: ["number", "null"]
        transformedValue:
          type: ["number", "null"]
        winsorizedValue:
          type: ["number", "null"]
        normalizedValue:
          type: ["number", "null"]
        configuredWeight:
          type: number
        effectiveWeight:
          type: number
        weightedContribution:
          type: ["number", "null"]
        available:
          type: boolean
        calculationStatus:
          type: string
          enum: [available, imputed, unavailable]
        missingDataTreatment:
          type: string
          enum: [exclude, cross_sectional_median]
        unavailableReason:
          type: ["string", "null"]
      # Audit fields introduced in A3 are present on new runs; older immutable
      # Strategy Snapshots cannot be retroactively populated with them.
      required: [factorId, factorName, rawValue, normalizedValue, configuredWeight, effectiveWeight, weightedContribution, available, unavailableReason]

    SignalExportError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required: [error, code]

    SignalCatalogEntry:
      type: object
      properties:
        signalId:
          type: string
        originalPath:
          type: string
        category:
          type: string
        availability:
          type: string
          enum: [persisted_history, latest_dataset_history, request_time_only]
        scope:
          type: string
          enum: [global, market, asset, pair]
        valueType:
          type: string
          enum: [number, string, boolean, "null", mixed]
        unit:
          type: ["string", "null"]
        historyAvailable:
          type: boolean
        description:
          type: string
      required: [signalId, originalPath, category, availability, scope, valueType, unit, historyAvailable, description]

    SignalProvenance:
      type: object
      properties:
        source:
          type: string
        sourceRecordId:
          type: ["string", "null"]
        originalPath:
          type: string
        uploadedAt:
          type: ["string", "null"]
        modelVersion:
          type: ["string", "null"]
        parameterVersion:
          type: ["string", "null"]
      required: [source, sourceRecordId, originalPath, uploadedAt, modelVersion, parameterVersion]

    SignalObservation:
      type: object
      properties:
        signalId:
          type: string
        category:
          type: string
        availability:
          type: string
          enum: [persisted_history, latest_dataset_history]
        scope:
          type: string
