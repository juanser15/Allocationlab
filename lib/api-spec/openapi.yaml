          type: ["number", "null"]
          description: Benchmark value indexed to 100 at backtest start, null if no benchmark selected or unavailable
        drawdownPct:
          type: number
          description: Portfolio drawdown from running peak, as a decimal (negative or zero)
      required: [date, portfolioIndex, benchmarkIndex, drawdownPct]

    BacktestPosition:
      type: object
      properties:
        ticker: { type: string }
        quantity: { type: number }
        price: { type: number }
        marketValue: { type: number }
        weight: { type: number }
      required: [ticker, quantity, price, marketValue, weight]

    BacktestLedgerTrade:
      type: object
      properties:
        ticker: { type: string }
        quantity: { type: number }
        notional: { type: number }
      required: [ticker, quantity, notional]

    BacktestLedgerEntry:
      type: object
      description: Close-to-close P&L on positions held before this close, then fills at this close. NAV units start at 100.
      properties:
        date: { type: string }
        intervalStart: { type: string }
        signalDate: { type: [string, "null"] }
        executionSignalDate: { type: [string, "null"] }
        beginningNav: { type: number }
        beginningCash: { type: number }
        beginningPositions:
          type: array
          items: { $ref: "#/components/schemas/BacktestPosition" }
        etfPnl: { type: number }
        cashPnl: { type: number }
        transactionCosts: { type: number }
        slippage: { type: number }
        trades:
          type: array
          items: { $ref: "#/components/schemas/BacktestLedgerTrade" }
        netPnl: { type: number }
        endingNav: { type: number }
        endingCash: { type: number }
        endingPositions:
          type: array
          items: { $ref: "#/components/schemas/BacktestPosition" }
      required: [date, intervalStart, signalDate, executionSignalDate, beginningNav, beginningCash, beginningPositions, etfPnl, cashPnl, transactionCosts, slippage, trades, netPnl, endingNav, endingCash, endingPositions]

    BacktestMonthlyReturn:
      type: object
      properties:
        month:
          type: string
          description: YYYY-MM
        portfolioReturn:
          type: number
        benchmarkReturn:
          type: ["number", "null"]
      required: [month, portfolioReturn, benchmarkReturn]

    BacktestConfigEcho:
      type: object
      properties:
        rebalanceFrequency:
          type: string
          enum: [monthly, quarterly]
        executionTiming:
          type: string
          enum: [same_close, next_close, next_open]
        transactionCostBps:
          type: number
        slippageBps:
          type: number
        maxTurnoverPerRebalance:
          type: number
        cashYieldAnnual:
          type: number
        warmupDays:
          type: integer
        startDate:
          type: ["string", "null"]
      required: [rebalanceFrequency, executionTiming, transactionCostBps, slippageBps, maxTurnoverPerRebalance, cashYieldAnnual, warmupDays, startDate]

    ValidationRunInput:
      oneOf:
        - $ref: "#/components/schemas/LegacyValidationRunInput"
        - $ref: "#/components/schemas/B3ValidationRunInput"

    LegacyValidationRunInput:
      type: object
      additionalProperties: false
      properties:
        sessionId: { type: integer }
        benchmark: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        rebalanceFrequency: { type: string, enum: [monthly, quarterly] }
        executionTiming: { type: string, enum: [same_close, next_close, next_open] }
        transactionCostBps: { type: number }
        slippageBps: { type: number }
        maxTurnoverPerRebalance: { type: number }
        cashYieldAnnual: { type: number }
        warmupDays: { type: integer }
      required: [sessionId]

    B3ValidationRunInput:
      type: object
      additionalProperties: false
      description: Runs a B3 point-in-time backtest from explicitly selected immutable B2 policy and B1 validation snapshots. No working/latest dataset is selected implicitly.
      properties:
        allocationId: { type: integer, minimum: 1 }
        validationPreparedInputId: { type: integer, minimum: 1 }
        assumptions:
          $ref: "#/components/schemas/B3ValidationAssumptions"
      required: [allocationId, validationPreparedInputId, assumptions]

    B3ValidationAssumptions:
      type: object
      description: Frozen evaluation and A1 execution settings applied to this validation.
      properties:
        evaluationStartDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        evaluationEndDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        decisionCalendar: { type: string, enum: [monthly, quarterly] }
        executionTiming: { type: string, enum: [same_close, next_close] }
        initialNav: { type: number, exclusiveMinimum: 0 }
        initialHoldings:
          type: object
          additionalProperties: { type: number, minimum: 0 }
        initialCash: { type: number, minimum: 0 }
        transactionCostBps: { type: number, minimum: 0 }
        slippageBps: { type: number, minimum: 0 }
        dailyCashYield: { type: number }
        benchmarkTicker: { type: string }
      required: [evaluationStartDate, evaluationEndDate, decisionCalendar, executionTiming, initialNav, initialHoldings, initialCash, transactionCostBps, slippageBps, dailyCashYield]

    C2ExperimentInput:
      type: object
      additionalProperties: false
      description: Frozen C2 diagnostics configuration. A new configuration always creates a new experiment.
      properties:
        allocationId: { type: integer, minimum: 1 }
        validationPreparedInputId: { type: integer, minimum: 1 }
        c1ExperimentId:
          anyOf:
            - type: integer
              minimum: 1
            - type: "null"
        alphaIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, minLength: 1 }
        startDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        endDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        regimeSource: { type: string, enum: [frozen_b1_prefix] }
        regimeMapping:
          type: object
          additionalProperties: { type: string, minLength: 1 }
        rollingWindow: { type: integer, minimum: 2, default: 63 }
        rollingStep: { type: integer, minimum: 1, default: 21 }
        contributionWindow: { type: integer, minimum: 2, default: 252 }
        contributionStep: { type: integer, minimum: 1, default: 63 }
        minRollingPaired: { type: integer, minimum: 2, default: 40 }
        minRegimePaired: { type: integer, minimum: 2, default: 30 }
        minSharpeObservations: { type: integer, minimum: 2, default: 30 }
        highCorrelationThreshold: { type: number, minimum: -1, maximum: 1, default: 0.8 }
        materialCorrelationGap: { type: number, minimum: 0, maximum: 2, default: 0.3 }
      required: [allocationId, validationPreparedInputId, c1ExperimentId, alphaIds, startDate, endDate, regimeSource]

    C2Experiment:
      type: object
      properties:
        id: { type: integer }
        allocationId: { type: integer }
        validationPreparedInputId: { type: integer }
        c1ExperimentId: { type: ["integer", "null"] }
        manifestHash: { type: string }
        inputHash: { type: string }
        resultHash: { type: string }
        manifest: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
      required: [id, allocationId, validationPreparedInputId, c1ExperimentId, manifestHash, inputHash, resultHash, manifest, result, createdAt]

    C2ExperimentReplay:
      type: object
      properties:
        experimentId: { type: integer }
        status: { type: string, enum: [pass, fail] }
        inputHash: { type: string }
        resultHash: { type: string }
        maximumNumericDifference: { type: number }
        differences:
          type: array
          items: { type: string }
      required: [experimentId, status, inputHash, resultHash, maximumNumericDifference, differences]

    C1ExperimentInput:
      type: object
      additionalProperties: false
      description: Runs a frozen B3 development-period comparison from a saved alpha-stream policy; no holdout metrics are generated.
      properties:
